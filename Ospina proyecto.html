<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Inteligente | Registro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #FFFFFF;
      color: #0D47A1;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .encabezado {
      background: #2196F3;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 20px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(33, 150, 243, 0.35);
      margin-bottom: 30px;
      width: 100%;
      max-width: 560px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .encabezado:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(33, 150, 243, 0.45);
    }

    .encabezado .icono {
      font-size: 32px;
      line-height: 1;
      animation: flotar 3s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .tarjeta {
      background: #FFFFFF;
      border: 2px solid rgba(33, 150, 243, 0.35);
      border-radius: 15px;
      padding: 40px 30px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.15);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .tarjeta:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(33, 150, 243, 0.25);
    }

    .titulo {
      font-size: 44px;
      color: #0D47A1;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-size: 28px;
      color: #2196F3;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .texto {
      font-size: 20px;
      color: #0D47A1;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .campo label {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: #0D47A1;
      margin-bottom: 8px;
    }

    .campo input {
      width: 100%;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 2px solid #2196F3;
      border-radius: 15px;
      color: #0D47A1;
      font-size: 20px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .campo input::placeholder {
      color: #90CAF9;
    }

    .campo input:focus {
      border-color: #0D47A1;
      box-shadow: 0 0 12px rgba(33, 150, 243, 0.35);
    }

    .boton {
      display: inline-block;
      width: 100%;
      background: #2196F3;
      color: #FFFFFF;
      border: none;
      border-radius: 15px;
      padding: 15px 34px;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 14px rgba(33, 150, 243, 0.35);
      margin-top: 6px;
      transition: background 0.3s ease, transform 0.25s ease, box-shadow 0.3s ease;
    }

    .boton:hover {
      background: #0D47A1;
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(13, 71, 161, 0.4);
    }

    .boton:active {
      transform: translateY(0);
    }

    .enlace {
      display: inline-block;
      margin-top: 20px;
      color: #2196F3;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .enlace:hover {
      color: #0D47A1;
    }

    .mensaje {
      margin-top: 16px;
      padding: 12px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .mensaje.error {
      display: block;
      background: #FFEBEE;
      color: #C62828;
      border: 2px solid #EF5350;
    }

    .mensaje.exito {
      display: block;
      background: #E8F5E9;
      color: #2E7D32;
      border: 2px solid #66BB6A;
    }
  </style>
</head>
<body>

  <header class="encabezado">
    <span class="icono">🏙️</span>
    CIUDAD INTELIGENTE
  </header>

  <div class="tarjeta">
    <h1 class="titulo">Registro</h1>
    <p class="subtitulo">Únete a la Ciudad Inteligente</p>
    <p class="texto">Registra tu nombre de usuario y contraseña para acceder a los servicios de la ciudad.</p>

    <form id="form-registro">
      <div class="campo">
        <label for="nombre">Nombre de Usuario</label>
        <input type="text" id="nombre" placeholder="Escribe tu nombre de usuario">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Escribe tu contraseña">
      </div>

      <button type="submit" class="boton">Registrarse</button>
    </form>

    <div id="mensaje" class="mensaje"></div>

    <a href="index.html" class="enlace">← Volver al inicio</a>
  </div>

  <script>
    const form = document.getElementById("form-registro");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const usuario = document.getElementById("nombre").value.trim();
      const password = document.getElementById("password").value.trim();

      if (usuario === "" || password === "") {
        mensaje.className = "mensaje error";
        mensaje.textContent = "Error: todos los campos deben estar llenos.";
        return;
      }

      localStorage.setItem("ciudadanoNombre", usuario);
      mensaje.className = "mensaje exito";
      mensaje.textContent = "¡Registro exitoso! Redirigiendo...";

      setTimeout(function () {
        window.location.href = "menu.html";
      }, 1200);
    });
  </script>

</body>
</html>
