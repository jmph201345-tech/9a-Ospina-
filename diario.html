<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciudad Inteligente | Diario Personal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 15%, rgba(0, 229, 255, 0.08), transparent 45%), #001B3A;
      color: #00E5FF;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .encabezado {
      background: linear-gradient(135deg, #00E5FF, #0D47A1);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 20px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      margin-bottom: 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .encabezado:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.8);
    }

    .encabezado .icono {
      font-size: 32px;
      line-height: 1;
      animation: flotar 3s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .contenedor {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .titulo {
      font-size: 42px;
      color: #00E5FF;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.7);
    }

    .subtitulo {
      font-size: 28px;
      color: #00E5FF;
      font-weight: 600;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }

    .texto {
      font-size: 20px;
      color: #4FC3F7;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .formulario {
      background: #06142E;
      border: 2px solid #00E5FF;
      border-radius: 15px;
      padding: 30px 24px;
      margin-bottom: 30px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .campo label {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: #00E5FF;
      margin-bottom: 8px;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 12px 16px;
      background: #03142E;
      border: 2px solid #00E5FF;
      border-radius: 15px;
      color: #00E5FF;
      font-size: 20px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .campo input::placeholder,
    .campo textarea::placeholder {
      color: #1F6F8B;
    }

    .campo input:focus,
    .campo textarea:focus {
      border-color: #4FC3F7;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
    }

    .campo input[type="date"] {
      color-scheme: dark;
    }

    .campo textarea {
      min-height: 140px;
      resize: vertical;
    }

    .boton {
      display: inline-block;
      background: #00E5FF;
      color: #000000;
      border: 2px solid #00E5FF;
      border-radius: 15px;
      padding: 14px 32px;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    .boton:hover {
      background: #0D47A1;
      color: #00E5FF;
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.9);
    }

    .boton:active {
      transform: translateY(0);
    }

    .boton-secundario {
      background: transparent;
      color: #00E5FF;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .boton-eliminar {
      background: #EF5350;
      color: #FFFFFF;
      border-color: #EF5350;
      box-shadow: 0 0 12px rgba(239, 83, 80, 0.4);
      padding: 10px 20px;
      font-size: 18px;
    }

    .boton-eliminar:hover {
      background: #C62828;
      border-color: #EF5350;
      box-shadow: 0 0 28px rgba(239, 83, 80, 0.8);
    }

    .botonera {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .mensaje {
      margin-top: 14px;
      padding: 12px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .mensaje.error {
      display: block;
      background: rgba(239, 83, 80, 0.15);
      color: #FF8A80;
      border: 2px solid #EF5350;
    }

    .mensaje.exito {
      display: block;
      background: rgba(0, 229, 255, 0.15);
      color: #00E5FF;
      border: 2px solid #00E5FF;
    }

    .lista {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .entrada {
      background: #06142E;
      border: 2px solid #00E5FF;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.25);
      animation: aparecer 0.4s ease both;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entrada-cabecera {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .entrada-titulo {
      font-size: 26px;
      color: #00E5FF;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }

    .entrada-fecha {
      font-size: 18px;
      color: #4FC3F7;
      font-weight: 600;
    }

    .entrada-texto {
      font-size: 20px;
      color: #4FC3F7;
      line-height: 1.6;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .vacio {
      font-size: 20px;
      color: #1F6F8B;
      text-align: center;
      padding: 20px;
      border: 2px dashed rgba(0, 229, 255, 0.3);
      border-radius: 15px;
    }

    .pie {
      text-align: center;
      margin-top: 30px;
      font-size: 20px;
      color: #00E5FF;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="encabezado">
    <span class="icono">📓</span>
    CIUDAD INTELIGENTE · DIARIO
  </div>

  <div class="contenedor">
    <h1 class="titulo">Diario Personal</h1>
    <p class="subtitulo">Registra tus recuerdos</p>
    <p class="texto">Escribe tus pensamientos y experiencias del día.</p>

    <form class="formulario" id="form-diario">
      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" placeholder="Ej: Mi primer día de clases">
      </div>

      <div class="campo">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>

      <div class="campo">
        <label for="texto">Texto</label>
        <textarea id="texto" placeholder="Escribe aquí lo que quieres recordar..."></textarea>
      </div>

      <button type="submit" class="boton">Guardar Entrada</button>
      <div id="mensaje" class="mensaje"></div>
    </form>

    <h2 class="subtitulo">Entradas Guardadas</h2>
    <div class="lista" id="lista-entradas"></div>

    <div class="botonera" style="margin-top: 24px;">
      <a class="boton boton-secundario" href="menu.html">← Volver al Menú</a>
    </div>

    <p class="pie">© 2026 Ciudad Inteligente · Mateo Ospina Jimenez</p>
  </div>

  <script>
    const CLAVE = "entradasDiario";
    const form = document.getElementById("form-diario");
    const mensaje = document.getElementById("mensaje");
    const lista = document.getElementById("lista-entradas");

    const fechaHoy = new Date().toISOString().split("T")[0];
    document.getElementById("fecha").value = fechaHoy;

    function obtenerEntradas() {
      const datos = localStorage.getItem(CLAVE);
      return datos ? JSON.parse(datos) : [];
    }

    function guardarEntradas(entradas) {
      localStorage.setItem(CLAVE, JSON.stringify(entradas));
    }

    function mostrarMensaje(tipo, texto) {
      mensaje.className = "mensaje " + tipo;
      mensaje.textContent = texto;
      setTimeout(function () {
        mensaje.className = "mensaje";
      }, 2500);
    }

    function renderizar() {
      const entradas = obtenerEntradas();
      lista.innerHTML = "";

      if (entradas.length === 0) {
        lista.innerHTML = '<p class="vacio">Aún no hay entradas en tu diario.</p>';
        return;
      }

      entradas.forEach(function (entrada) {
        const div = document.createElement("div");
        div.className = "entrada";

        const cabecera = document.createElement("div");
        cabecera.className = "entrada-cabecera";

        const tituloEl = document.createElement("h3");
        tituloEl.className = "entrada-titulo";
        tituloEl.textContent = entrada.titulo;

        const fechaEl = document.createElement("span");
        fechaEl.className = "entrada-fecha";
        fechaEl.textContent = "📅 " + entrada.fecha;

        cabecera.appendChild(tituloEl);
        cabecera.appendChild(fechaEl);

        const textoEl = document.createElement("p");
        textoEl.className = "entrada-texto";
        textoEl.textContent = entrada.texto;

        const btnEliminar = document.createElement("button");
        btnEliminar.className = "boton boton-eliminar";
        btnEliminar.textContent = "🗑️ Eliminar";

        btnEliminar.addEventListener("click", function () {
          const actualizadas = obtenerEntradas().filter(function (e) {
            return e.id !== entrada.id;
          });
          guardarEntradas(actualizadas);
          renderizar();
        });

        div.appendChild(cabecera);
        div.appendChild(textoEl);
        div.appendChild(btnEliminar);
        lista.appendChild(div);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const titulo = document.getElementById("titulo").value.trim();
      const fecha = document.getElementById("fecha").value;
      const texto = document.getElementById("texto").value.trim();

      if (titulo === "" || fecha === "" || texto === "") {
        mostrarMensaje("error", "Error: completa el título, la fecha y el texto.");
        return;
      }

      const entradas = obtenerEntradas();
      entradas.unshift({
        id: Date.now(),
        titulo: titulo,
        fecha: fecha,
        texto: texto
      });
      guardarEntradas(entradas);

      document.getElementById("titulo").value = "";
      document.getElementById("texto").value = "";
      document.getElementById("fecha").value = fechaHoy;

      mostrarMensaje("exito", "Entrada guardada correctamente.");
      renderizar();
    });

    renderizar();
  </script>

</body>
</html>
